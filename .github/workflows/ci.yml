#Se invece vogliamo utilizzare Zulip e fare i test su server Github, 
#questo esegue i tests a ogni push che viene fatto
#da posizionare in .github/workflows/

name: Acceptance Tests

on:
  push:
    branches: [ "main", "SCRUM-32" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    
    
    strategy:
      fail-fast: false 
      matrix:
        os: [ubuntu-latest] 
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' 

      - name: Install dependencies
        run: make install

      - name: Run Unit & Integration Tests
        run: make test-local

      - name: Run Acceptance Tests
        run: make test-acceptance

