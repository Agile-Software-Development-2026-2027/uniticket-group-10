name: CI
on:
  pull_request:
  push:
    branches: [main, SCRUM-32]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build uniTicket image
        run: docker compose -f uniticket/docker-compose.yml build uniticket

      - name: Run uniTicket tests
        run: >-
          docker compose -f uniticket/docker-compose.yml run --rm -T uniticket
          python manage.py test chatbot_tests