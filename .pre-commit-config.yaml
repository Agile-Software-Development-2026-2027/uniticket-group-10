repos:
  - repo: local
    hooks:
      - id: make-test
        name: Esecuzione test
        entry: make test-django-docker
        language: system
        #stages: [manual] 
        #decommentarlo se si vuole disattivare l'esecuzione automatica dei test pre-commit
        pass_filenames: false
        always_run: true
# Esegue i test Django dell'app assistant nel container Docker Compose.
