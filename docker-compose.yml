name: uniticket

services:
  # "upstream" is the original uniticket codebase
  upstream:
    build:
      context: uniticket/upstream
      dockerfile: Dockerfile
    
    image: uniticket-upstream

  uniticket:
    build:
      context: .
      dockerfile: uniticket/Dockerfile
      additional_contexts:
        upstream: "service:upstream" # Tell docker the extensions need upstream to work

    environment:
      PYTHONPATH: /:/app/uniticket:/extensions # Add root aswell for settings file lookup
      DJANGO_SETTINGS_MODULE: extensions.settings # Hook into django initialization
      ASSISTANT_AGENT_URL: http://agent:8001/conversation
      QDRANT_URL: http://qdrant:6333

    depends_on:
      agent:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./uniticket/config/settings.py:/extensions/settings.py:ro
      - ./uniticket/config/settingslocal.py:/app/uniticket/uni_ticket_project/settingslocal.py:ro
      - ./uniticket/dumps:/dumps:ro
      - uniticket-data:/data

    working_dir: /app/uniticket

    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py loaddata /dumps/local_conf.json &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "

  agent:
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway" # Required for Linux
    build:
      context: .
      dockerfile: agent/Dockerfile
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.14.1
    # Rende la dashboard accessibile soltanto dal PC locale.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  uniticket-data:
  qdrant-data:
