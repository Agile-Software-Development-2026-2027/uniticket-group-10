name: uniticket

services:
  # "upstream" is the original uniticket codebase
  upstream:
    build:
      context: uniticket/upstream
      dockerfile: Dockerfile
    
    image: uniticket-upstream

  uniticket:
    build:
      context: .
      dockerfile: uniticket/Dockerfile
      additional_contexts:
        upstream: "service:upstream" # Tell docker the extensions need upstream to work

    environment:
      PYTHONPATH: /:/app/uniticket:/extensions # Add root aswell for settings file lookup
      DJANGO_SETTINGS_MODULE: extensions.settings # Hook into django initialization
      # Il classificatore risponde al widget. Per tornare all'agente Python: http://agent:8001/conversation
      ASSISTANT_AGENT_URL: http://classifier:8001/conversation

    depends_on:
      classifier:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./uniticket/config/settings.py:/extensions/settings.py:ro
      - ./uniticket/config/settingslocal.py:/app/uniticket/uni_ticket_project/settingslocal.py:ro
      - ./uniticket/dumps:/dumps:ro
      - uniticket-data:/data

    working_dir: /app/uniticket

    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py loaddata /dumps/local_conf.json &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  classifier:
    build:
      context: classifier
    expose:
      - "8001"
    environment:
      # Dal file .env nella root (non tracciato). Senza chiave risponde con i soli risultati della ricerca.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # Ollama gira sull'host, con bge-m3. Se non risponde, il classificatore usa solo BM25.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8001 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

volumes:
  uniticket-data:
