# backend sceglie la sezione da usare: openai oppure codex.
# api_key_env: nome della variabile, non la chiave. null per server senza autenticazione.
# reasoning: stringa oppure false (= "none"); deve essere supportato dal modello.
# Parametri null vengono omessi dalle richieste.
backend: codex # <-- cambialo se vuoi usare openai per la generazione
openai:
  endpoint: http://localhost:1234/v1
  api_key_env: null
  model_name: google/gemma-4-e4b
  max_tokens: 5000  # null: usa il limite predefinito del server.
  reasoning: false 
  temperature: 0.3
  # Utili per trovare la configurazione giusta
  #top_k: null
  #top_p: null
  #penalize:
    #frequency_penalty: null
    #presence_penalty: null
codex:
  model_name: gpt-6.1-sol # <--- best solution so far
  reasoning: low
