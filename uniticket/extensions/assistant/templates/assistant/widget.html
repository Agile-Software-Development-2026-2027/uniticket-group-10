{% load static %}
<link rel="stylesheet" href="{% static 'assistant/css/widget.css' %}">

<div id="assistant-widget" class="assistant-widget"
     data-search-url="{% url 'assistant_search' %}"
     data-open-url="{% url 'assistant_open' %}"
     {% if request.resolver_match.view_name == 'uni_ticket:add_new_ticket' and categoria and form and user_can_open_tickets %}
     data-loaded-ticket-id="{{ categoria.pk }}"
     {% endif %}
     data-storage-key="assistant-chat-{{ request.user.pk }}">

    <section id="assistant-panel" class="assistant-panel" aria-labelledby="assistant-title" hidden>
        <header class="assistant-header">
            <div>
                <h2 id="assistant-title">Assistente UniTicket</h2>
                <p>Trova la richiesta giusta</p>
            </div>
            <button type="button" class="assistant-close" aria-label="Chiudi l'assistente">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
            </button>
        </header>
        <div class="assistant-toolbar">
            <span>La tua conversazione</span>
            <button type="button" class="assistant-reset">Nuova conversazione</button>
        </div>
        <div class="assistant-messages" role="log" aria-label="Conversazione con l'assistente" aria-live="polite" aria-relevant="additions"></div>
        <p class="assistant-status" role="status"></p>
        <form class="assistant-form">
            {% csrf_token %}
            <div class="assistant-compose">
                <textarea id="assistant-query" name="query" rows="1" maxlength="500" required
                          aria-label="Messaggio per l'assistente"
                          aria-describedby="assistant-input-help"
                          placeholder="Scrivi la tua richiesta…"></textarea>
                <button type="submit" class="assistant-send">
                    <span>Invia</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19 0-14m-6 6 6-6 6 6"/></svg>
                </button>
            </div>
            <p id="assistant-input-help">Invio per inviare · Maiusc+Invio per andare a capo</p>
        </form>
    </section>

    <button type="button" class="assistant-launcher" aria-controls="assistant-panel"
            aria-expanded="false" aria-label="Apri l'assistente UniTicket">
        <span class="assistant-launcher-icon" aria-hidden="true">
            <svg class="assistant-launcher-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/><path d="M8 10h8M8 14h5"/></svg>
            <svg class="assistant-launcher-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg>
        </span>
        <span>Assistente</span>
    </button>
</div>

<script src="{% static 'assistant/js/widget.js' %}" defer></script>
